version: 2

# Every ecosystem: monthly version updates (1st of the month, UTC), minor and
# patch bumps grouped into one PR, majors as separate PRs. The 7-day cooldown
# matches mise's minimum_release_age, so freshly published (possibly
# compromised) releases are skipped. Security updates ignore both the schedule
# and the cooldown and still open immediately.
updates:
  # Go dependencies
  - package-ecosystem: gomod
    directory: "/api"
    schedule:
      interval: monthly
      time: "03:15"
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    assignees:
      - mkutlak

  # NPM
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: monthly
      time: "03:15"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    ignore:
      # Held at vitest 4 until allure-vitest supports vitest 5 — see "vitest-4-hold" in ui/package.json
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    assignees:
      - mkutlak

  # GitHub Actions (pinned by SHA; Dependabot bumps the SHA and the version comment)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "03:15"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    pull-request-branch-name:
      separator: "-"
    assignees:
      - mkutlak

  # Docker
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
      time: "03:15"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
    pull-request-branch-name:
      separator: "-"
    assignees:
      - mkutlak
