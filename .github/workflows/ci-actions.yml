name: CI — Workflows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - "mise.toml"
      - "mise.lock"

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: zizmor

      - name: zizmor
        run: mise run gha:lint
        env:
          GH_TOKEN: ${{ github.token }}
          # Otherwise `mise run` installs the whole toolchain, defeating install_args.
          MISE_TASK_RUN_AUTO_INSTALL: "false"
