name: CI — Helm Chart

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-chart.yml"

permissions:
  contents: read

jobs:
  chart-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Lint chart
        run: mise run helm:lint

      - name: Template chart (validate rendering)
        run: mise run helm:template
