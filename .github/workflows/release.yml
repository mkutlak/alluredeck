name: Release

on:
  workflow_dispatch:
    inputs:
      force-release:
        description: "Force semantic-release to run (useful after path-ignore skips)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "charts/**"
      - "*.md"
      - "docs/**"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/mkutlak/alluredeck-api
  IMAGE_UI: ghcr.io/mkutlak/alluredeck-ui

jobs:
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Cache Go build & modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: API tests
        run: mise run api:test

  test-ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: UI install
        run: mise run ui:install

      - name: UI tests
        run: mise run ui:test

  release:
    name: Semantic release
    needs: [test-api, test-ui]
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}
      new-release-git-tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          # All extra plugins are major-pinned so a new upstream major can't
          # break the release lane on its own schedule.
          #
          # conventional-changelog-conventionalcommits is pinned to 8, the last
          # major compatible with conventional-changelog-writer@8: the action
          # bundles semantic-release ^25, whose release-notes-generator (v14)
          # ships writer@8, while preset 9+ requires writer@9 — an unpinned
          # preset resolves to 10.x and crashes generateNotes with 'Missing
          # helper'. No stable writer@9 combination exists yet (the writer@9
          # release-notes-generator is 15.0.0-beta); bump the preset to its
          # current major once the action bundles release-notes-generator >=15
          # stable.
          extra_plugins: |
            @semantic-release/changelog@7
            @semantic-release/git@11
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-images:
    name: Build and push image
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alluredeck-api
            dockerfile: docker/Dockerfile.api
          - image: alluredeck-ui
            dockerfile: docker/Dockerfile.ui
          - image: alluredeck-mcp
            dockerfile: docker/Dockerfile.mcp
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.new-release-git-tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/mkutlak/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new-release-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new-release-version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new-release-version }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.release.outputs.new-release-version }}
            VITE_APP_VERSION=${{ needs.release.outputs.new-release-version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            BUILD_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/mkutlak/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
