name: Release

on:
  workflow_dispatch:
    inputs:
      force-release:
        description: "Force semantic-release to run (useful after path-ignore skips)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "charts/**"
      - "*.md"
      - "docs/**"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/mkutlak/alluredeck-api
  IMAGE_UI: ghcr.io/mkutlak/alluredeck-ui

jobs:
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Cache Go build & modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: API tests
        run: mise run api:test

  test-ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: UI install
        run: mise run ui:install

      - name: UI tests
        run: mise run ui:test

  release:
    name: Semantic release
    needs: [test-api, test-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the CHANGELOG commit and tag, create the GitHub release
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}
      new-release-git-tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        with:
          # semantic-release and all extra plugins are major-pinned so a new
          # upstream major can't break the release lane on its own schedule.
          # Without semantic_version the action runs a bare `npm install
          # semantic-release` on every release, i.e. whatever npm tags latest.
          semantic_version: "25"
          # conventional-changelog-conventionalcommits is pinned to 8, the last
          # major compatible with conventional-changelog-writer@8: semantic-release
          # 25 depends on release-notes-generator v14, which ships writer@8,
          # while preset 9+ requires writer@9 — an unpinned preset resolves to
          # 10.x and crashes generateNotes with 'Missing helper'. No stable
          # writer@9 combination exists yet (the writer@9 release-notes-generator
          # is 15.0.0-beta); bump the preset to its current major together with
          # semantic_version once a semantic-release major ships
          # release-notes-generator >=15 stable.
          extra_plugins: |
            @semantic-release/changelog@7
            @semantic-release/git@11
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-images:
    name: Build and push image
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # store the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alluredeck-api
            dockerfile: docker/Dockerfile.api
          - image: alluredeck-ui
            dockerfile: docker/Dockerfile.ui
          - image: alluredeck-mcp
            dockerfile: docker/Dockerfile.mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.new-release-git-tag }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/mkutlak/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new-release-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new-release-version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new-release-version }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.release.outputs.new-release-version }}
            VITE_APP_VERSION=${{ needs.release.outputs.new-release-version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            BUILD_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/mkutlak/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
