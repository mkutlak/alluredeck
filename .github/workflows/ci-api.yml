name: CI — API

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-api.yml"

permissions:
  contents: read

jobs:
  api-check:
    name: API quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Cache Go build & modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: go vet
        run: mise run api:vet

      - name: golangci-lint
        run: mise run api:lint

      - name: go test
        run: mise run api:test
