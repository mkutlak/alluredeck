name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "mise.toml"
      - "mise.lock"

permissions:
  contents: read

jobs:
  release-chart:
    name: Release Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the helm-v* tag
      packages: write # push the chart and ArtifactHub metadata to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Read chart version
        id: version
        run: |
          VERSION=$(yq '.version' charts/alluredeck/Chart.yaml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag-check
        env:
          TAG: "helm-v${{ steps.version.outputs.version }}"
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists, skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Package and push Helm chart
        if: steps.tag-check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mise run helm:package
          helm push alluredeck-${VERSION}.tgz oci://ghcr.io/mkutlak/charts

      - name: Install oras
        if: steps.tag-check.outputs.exists == 'false'
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Push ArtifactHub metadata
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${ACTOR}" --password-stdin
          oras push ghcr.io/mkutlak/charts/alluredeck:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create helm tag
        if: steps.tag-check.outputs.exists == 'false'
        # Via the API rather than git push, so the checkout never persists credentials.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "helm-v${{ steps.version.outputs.version }}"
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
