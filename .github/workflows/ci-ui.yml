name: CI — UI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-ui.yml"

permissions:
  contents: read

jobs:
  ui-check:
    name: UI quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: mise run ui:install

      - name: Type check
        run: mise run ui:typecheck

      - name: Lint
        run: mise run ui:lint

      - name: Test
        run: mise run ui:coverage
